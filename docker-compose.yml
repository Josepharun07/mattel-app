services:
  postgres:
    image: postgres:16
    container_name: mattel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mattel_infrastructures
    ports:
      - "5432:5432"
    volumes:
      - mattel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mattel_infrastructures"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mattel_postgres:
